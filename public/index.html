<script>
    // Função para alternar o menu no mobile
    function toggleMenuMobile() {
        document.getElementById('sidebarMenu').classList.toggle('mobile-open');
    }

    // Função para carregar as páginas internas no iframe
    function carregarPagina(url, elemento) {
        event.preventDefault();
        document.querySelectorAll('.btn-menu').forEach(btn => btn.classList.remove('active'));
        if (elemento) elemento.classList.add('active');

        document.getElementById('viewportWelcome').style.display = 'none';
        const frameContainer = document.getElementById('frameContainer');
        frameContainer.style.display = 'block';
        document.getElementById('conteudoIframe').src = url;

        if (window.innerWidth <= 768) {
            document.getElementById('sidebarMenu').classList.remove('mobile-open');
        }
    }

    // Verifica a sessão atual ao carregar a página
    function verificarSessao() {
        const usuarioLogado = localStorage.getItem('usuarioLogado');
        const telaLogin = document.getElementById('telaLoginWrapper');

        if (!usuarioLogado) {
            telaLogin.style.display = 'flex';
        } else {
            telaLogin.style.display = 'none';
            configurarPermissoesPainel();
        }
    }

    // Configura permissões e nome do usuário na tela
    function configurarPermissoesPainel() {
        const tipoUsuario = localStorage.getItem('tipoUsuario') || 'comum';
        const ehAdminOuMaster = (tipoUsuario === 'master' || tipoUsuario === 'administrador');

        if (ehAdminOuMaster) {
            document.getElementById('btnAdminUsuarios').style.display = 'flex';
            document.getElementById('btnAdminCadastros').style.display = 'flex';
            document.getElementById('btnExcluirUsuarios').style.display = 'flex';
            document.getElementById('btnChecklistsAdm').style.display = 'flex';
        }

        const usuarioSalvo = localStorage.getItem('usuarioLogado') || 'Paulo Silva';
        let nomeFormatado = usuarioSalvo;

        if (usuarioSalvo.includes('@')) {
            const partes = usuarioSalvo.split('@')[0].split('.');
            nomeFormatado = partes.map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(' ');
        }

        document.getElementById('nomeUsuarioLogado').innerText = nomeFormatado;
    }

    // Validação de Login Direta no Cliente (Sem Backend / Ideal para Vercel)
    document.getElementById('formLogin').addEventListener('submit', (e) => {
        e.preventDefault();
        const usuarioInput = document.getElementById('loginUsuario').value.trim();
        const senhaInput = document.getElementById('loginSenha').value;

        // DEFINIÇÃO DO USUÁRIO MASTER DIRETO NO CÓDIGO
        const MASTER_USER = "prodrigosilvacel@gmail.com";
        const MASTER_PASS = "w18187";

        if (usuarioInput === MASTER_USER && senhaInput === MASTER_PASS) {
            // Sucesso no login master
            localStorage.setItem('usuarioLogado', MASTER_USER);
            localStorage.setItem('tipoUsuario', 'master');
            localStorage.setItem('isMaster', 'true');

            document.getElementById('telaLoginWrapper').style.display = 'none';
            configurarPermissoesPainel();
            document.getElementById('formLogin').reset();
        } else {
            // Caso queira adicionar mais usuários hardcoded, pode criar validações extras aqui
            alert('Usuário ou senha inválidos.');
        }
    });

    // Função para sair do sistema (Logout)
    function fazerLogout() {
        localStorage.clear();
        document.getElementById('telaLoginWrapper').style.display = 'flex';
        document.getElementById('viewportWelcome').style.display = 'flex';
        document.getElementById('frameContainer').style.display = 'none';
    }

    function abrirModalUsuario() {
        document.getElementById('modalUsuario').style.display = 'flex';
        if (window.innerWidth <= 768) {
            document.getElementById('sidebarMenu').classList.remove('mobile-open');
        }
    }

    function fecharModalUsuario() {
        document.getElementById('modalUsuario').style.display = 'none';
        document.getElementById('formAdminCadastro').reset();
    }

    function irParaExcluirUsuarios() {
        carregarPagina('excluir-usuarios.html', document.getElementById('btnExcluirUsuarios'));
    }

    // Cadastro de novos usuários simulado no front (salvando localmente se precisar)
    document.getElementById('formAdminCadastro').addEventListener('submit', (e) => {
        e.preventDefault();
        alert('Usuário cadastrado com sucesso!');
        fecharModalUsuario();
    });

    // Executa ao carregar
    window.addEventListener('DOMContentLoaded', verificarSessao);
</script>
